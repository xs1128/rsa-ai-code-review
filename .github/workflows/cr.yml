name: AI Code Review

permissions:
  contents: read
  pull-requests: write
  models: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_MODELS: true
          MODEL: openai/gpt-4o
          LANGUAGE: Chinese
          PROMPT: |
            You are an experienced C reviewer doing a formal code inspection.
            For every defect found in the diff, output one bullet line:
            - Line N | Severity (Critical/Major/Minor) | Type (Syntactic/Semantic/Logic/Interface/Security/Documentation) | Description and suggested fix.
            Be exhaustive. Look especially for: syntax errors, missing returns, wrong operators (= vs ==, & misuse), undeclared identifiers, security issues (rand() for crypto), and missing input validation.
          top_p: 1
          temperature: 0.2
          max_tokens: 10000
          MAX_PATCH_LENGTH: 10000
